name: Scrape Football Data

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-22.04  # 최신 우분투 환경 대신 안정적인 22.04 지정

    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4  # v3 -> v4로 업그레이드

      - name: Python 설치
        uses: actions/setup-python@v5  # v4 -> v5로 업그레이드
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 수집 스크립트 실행
        run: python scraper.py

      - name: 깃허브에 자동 저장(커밋)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/players_market_value.csv
          git commit -m "Auto-update: 최신 축구 선수 데이터 갱신" || echo "변경사항 없음"
          git push
